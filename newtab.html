<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewTab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Wallpaper layer -->
  <div class="wallpaper" id="wallpaper"></div>
  <div class="wallpaper-overlay" id="wallpaperOverlay"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Top HUD bar -->
  <header class="hud-top">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-status">
      <span class="hud-dot"></span>
      <span id="hudClock" class="hud-clock">00:00:00</span>
    </div>
    <button class="hud-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <!-- Main content -->
  <main class="stage">
    <!-- Title -->
    <h1 class="title">NETRUNNER</h1>
    <div class="subtitle">A fresh start awaits</div>

    <!-- Search box -->
    <form class="search-panel" id="searchForm" autocomplete="off">
      <div class="search-tabs" role="tablist">
        <button type="button" class="tab tab-baidu active" data-engine="baidu" role="tab">
          <span class="tab-dot"></span>Baidu
        </button>
        <button type="button" class="tab tab-bing" data-engine="bing" role="tab">
          <span class="tab-dot"></span>Bing
        </button>
        <button type="button" class="tab tab-google" data-engine="google" role="tab">
          <span class="tab-dot"></span>Google
        </button>
        <button type="button" class="tab tab-github" data-engine="github" role="tab">
          <span class="tab-dot"></span>GitHub
        </button>
        <span class="tab-glider" id="tabGlider"></span>
      </div>
      <div class="search-row">

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="TYPE TO QUERY..."
          spellcheck="false"
          autocomplete="off"
        />
        <button type="submit" class="search-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M13 5l7 7-7 7" />
          </svg>
        </button>
      </div>
      <div class="search-meta">
        <span>Searching with</span>
        <span id="engineLabel">Baidu</span>
      </div>
    </form>
  </main>

  <!-- Bottom HUD -->
  <footer class="hud-bottom">
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>
    <div class="hud-footer-text">NewTab · v1.0.0</div>
  </footer>

  <!-- Settings Panel -->
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-card">
      <div class="settings-header">
        <div class="settings-title">
          <span class="settings-bar"></span>
          <span>WALLPAPER CONTROL</span>
        </div>
        <button class="close-btn" id="closeSettings" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="settings-body">
        <!-- Source picker -->
        <div class="setting-group">
          <label class="setting-label">SOURCE // 壁纸来源</label>
          <div class="source-tabs">
            <button class="src-tab active" data-src="url">URL</button>
            <button class="src-tab" data-src="upload">UPLOAD</button>
            <button class="src-tab" data-src="builtin">BUILTIN</button>
          </div>
        </div>

        <div class="setting-group" id="urlGroup">
          <label class="setting-label">IMAGE URL</label>
          <input type="text" id="wallpaperUrl" class="cyber-input" placeholder="https://..." />
          <button class="cyber-btn" id="applyUrl">APPLY</button>
        </div>

        <div class="setting-group hidden" id="uploadGroup">
          <label class="setting-label">LOCAL FILE</label>
          <label class="cyber-upload">
            <input type="file" id="wallpaperFile" accept="image/*" hidden />
            <span>CHOOSE FILE</span>
          </label>
          <div class="hint" id="fileHint">No file selected</div>
        </div>

        <div class="setting-group hidden" id="builtinGroup">
          <label class="setting-label">PRESET</label>
          <div class="builtin-grid" id="builtinGrid"></div>
        </div>

        <!-- Sliders -->
        <div class="setting-group">
          <div class="slider-row">
            <label class="setting-label">BLUR</label>
            <span class="slider-value" id="blurValue">0px</span>
          </div>
          <input type="range" min="0" max="20" value="0" id="blurSlider" class="cyber-slider" />
        </div>

        <div class="setting-group">
          <div class="slider-row">
            <label class="setting-label">BRIGHTNESS</label>
            <span class="slider-value" id="brightnessValue">100%</span>
          </div>
          <input type="range" min="40" max="160" value="100" id="brightnessSlider" class="cyber-slider" />
        </div>

        <div class="setting-group">
          <div class="slider-row">
            <label class="setting-label">SATURATION</label>
            <span class="slider-value" id="saturationValue">100%</span>
          </div>
          <input type="range" min="0" max="200" value="100" id="saturationSlider" class="cyber-slider" />
        </div>

        <button class="cyber-btn cyber-btn-warn" id="resetSettings">RESET ALL</button>
      </div>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
