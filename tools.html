<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tools.css" />
</head>
<body class="tools-body">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="wallpaper-overlay"></div>

  <!-- Top bar -->
  <header class="tools-topbar">
    <div class="tools-topbar-left">
      <a href="newtab.html" class="tools-back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        <span>Back</span>
      </a>
      <div class="tools-title">
        <span class="tools-title-bar"></span>
        <span>Tools</span>
      </div>
    </div>
    <div class="tools-topbar-right">
      <button class="tools-theme-btn" id="toolsThemeBtn" type="button" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main layout: sidebar + content -->
  <div class="tools-layout">
    <aside class="tools-sidebar">
      <nav>
        <button class="tool-nav active" data-tool="calculator">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
          <span>计算器</span>
        </button>
        <button class="tool-nav" data-tool="base">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M9 4l-2 16M17 4l-2 16"/></svg>
          <span>进制转换</span>
        </button>
        <button class="tool-nav" data-tool="encode">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          <span>编码转换</span>
        </button>
        <button class="tool-nav" data-tool="amount">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          <span>金额大写</span>
        </button>
        <button class="tool-nav" data-tool="color">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.8 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.5-.7-.5-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.4-4.5-8-10-8z"/></svg>
          <span>配色</span>
        </button>
        <button class="tool-nav" data-tool="random">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 3v18M8 3v18M3 8h18M3 16h18"/></svg>
          <span>随机决定</span>
        </button>
        <button class="tool-nav" data-tool="qrcode">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M18 18h3M14 18v3h3M21 14v7"/></svg>
          <span>二维码</span>
        </button>
        <button class="tool-nav" data-tool="json">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H6a3 3 0 00-3 3v3a3 3 0 01-3 3M8 21H6a3 3 0 01-3-3v-3a3 3 0 00-3-3M16 3h2a3 3 0 013 3v3a3 3 0 003 3M16 21h2a3 3 0 003-3v-3a3 3 0 013-3"/></svg>
          <span>JSON 格式化</span>
        </button>
        <button class="tool-nav" data-tool="uuid">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg>
          <span>UUID 生成</span>
        </button>
        <button class="tool-nav" data-tool="timestamp">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>时间戳</span>
        </button>
      </nav>
    </aside>

    <main class="tools-content">
      <!-- Calculator -->
      <section class="tool-panel active" data-panel="calculator">
        <h2 class="tool-title">计算器</h2>
        <div class="calc">
          <input type="text" id="calcDisplay" class="calc-display" readonly value="0" />
          <div class="calc-grid">
            <button class="calc-btn calc-func" data-action="clear">AC</button>
            <button class="calc-btn calc-func" data-action="sign">±</button>
            <button class="calc-btn calc-func" data-action="percent">%</button>
            <button class="calc-btn calc-op" data-op="/">÷</button>
            <button class="calc-btn" data-num="7">7</button>
            <button class="calc-btn" data-num="8">8</button>
            <button class="calc-btn" data-num="9">9</button>
            <button class="calc-btn calc-op" data-op="*">×</button>
            <button class="calc-btn" data-num="4">4</button>
            <button class="calc-btn" data-num="5">5</button>
            <button class="calc-btn" data-num="6">6</button>
            <button class="calc-btn calc-op" data-op="-">−</button>
            <button class="calc-btn" data-num="1">1</button>
            <button class="calc-btn" data-num="2">2</button>
            <button class="calc-btn" data-num="3">3</button>
            <button class="calc-btn calc-op" data-op="+">+</button>
            <button class="calc-btn calc-zero" data-num="0">0</button>
            <button class="calc-btn" data-action="dot">.</button>
            <button class="calc-btn calc-eq" data-action="equals">=</button>
          </div>
        </div>
      </section>

      <!-- Base converter -->
      <section class="tool-panel" data-panel="base">
        <h2 class="tool-title">进制转换</h2>
        <div class="tool-row">
          <label>BIN (二进制)</label>
          <input type="text" id="baseBin" class="cyber-input mono" placeholder="1010" />
        </div>
        <div class="tool-row">
          <label>OCT (八进制)</label>
          <input type="text" id="baseOct" class="cyber-input mono" placeholder="12" />
        </div>
        <div class="tool-row">
          <label>DEC (十进制)</label>
          <input type="text" id="baseDec" class="cyber-input mono" placeholder="10" />
        </div>
        <div class="tool-row">
          <label>HEX (十六进制)</label>
          <input type="text" id="baseHex" class="cyber-input mono" placeholder="A" />
        </div>
      </section>

      <!-- Encode/decode -->
      <section class="tool-panel" data-panel="encode">
        <h2 class="tool-title">编码转换</h2>
        <div class="tool-row">
          <label>原文</label>
          <textarea id="encInput" class="cyber-input mono" rows="3" placeholder="输入文本..."></textarea>
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" data-enc="base64-encode">Base64 编码</button>
          <button class="cyber-btn" data-enc="base64-decode">Base64 解码</button>
          <button class="cyber-btn" data-enc="url-encode">URL 编码</button>
          <button class="cyber-btn" data-enc="url-decode">URL 解码</button>
          <button class="cyber-btn" data-enc="unicode-escape">Unicode 转义</button>
        </div>
        <div class="tool-row">
          <label>结果</label>
          <textarea id="encOutput" class="cyber-input mono" rows="3" readonly placeholder="结果..."></textarea>
        </div>
      </section>

      <!-- Amount to Chinese uppercase -->
      <section class="tool-panel" data-panel="amount">
        <h2 class="tool-title">金额大写转换</h2>
        <div class="tool-row">
          <label>数字金额</label>
          <input type="text" id="amountInput" class="cyber-input mono" placeholder="1234.56" />
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" id="amountConvert">转换为大写</button>
        </div>
        <div class="tool-row">
          <label>大写金额</label>
          <textarea id="amountOutput" class="cyber-input mono" rows="2" readonly></textarea>
        </div>
      </section>

      <!-- Color picker -->
      <section class="tool-panel" data-panel="color">
        <h2 class="tool-title">配色 / 色号</h2>
        <div class="color-grid">
          <div class="color-row">
            <input type="color" id="colorPicker" value="#0067c0" />
            <input type="text" id="colorHex" class="cyber-input mono" value="#0067c0" />
          </div>
          <div class="color-swatches" id="colorSwatches"></div>
          <div class="color-info" id="colorInfo"></div>
        </div>
      </section>

      <!-- Random picker -->
      <section class="tool-panel" data-panel="random">
        <h2 class="tool-title">随机决定</h2>
        <p class="hint">最多填入 5 个选项，随机选出 1 个</p>
        <div class="random-inputs" id="randomInputs">
          <input type="text" class="cyber-input" placeholder="选项 1" data-idx="0" />
          <input type="text" class="cyber-input" placeholder="选项 2" data-idx="1" />
          <input type="text" class="cyber-input" placeholder="选项 3" data-idx="2" />
          <input type="text" class="cyber-input" placeholder="选项 4" data-idx="3" />
          <input type="text" class="cyber-input" placeholder="选项 5" data-idx="4" />
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" id="randomGo">开始随机</button>
        </div>
        <div class="random-result" id="randomResult"></div>
      </section>

      <!-- QR Code -->
      <section class="tool-panel" data-panel="qrcode">
        <h2 class="tool-title">文字 → 二维码</h2>
        <div class="tool-row">
          <label>文本</label>
          <textarea id="qrInput" class="cyber-input mono" rows="3" placeholder="输入要生成二维码的文本..."></textarea>
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" id="qrGen">生成</button>
        </div>
        <div class="qr-output" id="qrOutput"></div>
      </section>

      <!-- JSON formatter -->
      <section class="tool-panel" data-panel="json">
        <h2 class="tool-title">JSON 格式化</h2>
        <div class="tool-row">
          <label>JSON</label>
          <textarea id="jsonInput" class="cyber-input mono" rows="6" placeholder='{"key":"value"}'></textarea>
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" id="jsonFormat">格式化</button>
          <button class="cyber-btn" id="jsonMinify">压缩</button>
        </div>
        <div class="tool-row">
          <label>结果</label>
          <textarea id="jsonOutput" class="cyber-input mono" rows="6" readonly></textarea>
        </div>
        <div class="tool-status" id="jsonStatus"></div>
      </section>

      <!-- UUID generator -->
      <section class="tool-panel" data-panel="uuid">
        <h2 class="tool-title">UUID 生成器</h2>
        <div class="tool-row">
          <label>数量</label>
          <input type="number" id="uuidCount" class="cyber-input mono" value="1" min="1" max="20" />
        </div>
        <div class="tool-actions">
          <button class="cyber-btn" id="uuidGen">生成</button>
        </div>
        <div class="tool-row">
          <label>结果</label>
          <textarea id="uuidOutput" class="cyber-input mono" rows="4" readonly></textarea>
        </div>
      </section>

      <!-- Timestamp -->
      <section class="tool-panel" data-panel="timestamp">
        <h2 class="tool-title">时间戳转换</h2>
        <div class="tool-row">
          <label>当前时间</label>
          <div class="now-row">
            <div class="now-cell"><span class="lbl">Unix</span><span id="tsNowUnix" class="val mono">--</span></div>
            <div class="now-cell"><span class="lbl">ISO</span><span id="tsNowIso" class="val mono">--</span></div>
            <div class="now-cell"><span class="lbl">本地</span><span id="tsNowLocal" class="val mono">--</span></div>
          </div>
        </div>
        <div class="tool-row">
          <label>Unix → 日期</label>
          <input type="text" id="tsInput" class="cyber-input mono" placeholder="1718236800" />
          <div class="tool-actions"><button class="cyber-btn" id="tsToDate">转换</button></div>
          <div class="ts-output" id="tsToDateOut"></div>
        </div>
        <div class="tool-row">
          <label>日期 → Unix</label>
          <input type="text" id="tsDateInput" class="cyber-input mono" placeholder="2024-06-13 12:00:00" />
          <div class="tool-actions"><button class="cyber-btn" id="tsToUnix">转换</button></div>
          <div class="ts-output" id="tsToUnixOut"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="tools.js"></script>
</body>
</html>
